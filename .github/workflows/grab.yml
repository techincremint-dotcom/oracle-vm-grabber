name: Grab free VM
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
concurrency: { group: grab, cancel-in-progress: false }
permissions:
  contents: write
  actions: write
jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.mark.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -q oci==2.150.0 || pip install -q oci
      - run: python grab_once.py | tee out.txt
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
          SSH_PUBKEY: ${{ secrets.SSH_PUBKEY }}
      - name: Mark VM ready (once) so the morning check can see it
        id: mark
        run: |
          if grep -qE 'LAUNCHED|already exists' out.txt; then echo "ready=true" >> "$GITHUB_OUTPUT"; fi
          if grep -qE 'LAUNCHED|already exists' out.txt && [ ! -f STATUS.txt ]; then
            echo "VM ready $(date -u +%Y-%m-%dT%H:%MZ)" > STATUS.txt
            git config user.name grabber; git config user.email grabber@users.noreply.github.com
            git add STATUS.txt && git commit -m "VM ready" && git push
          fi

  # GitHub's cron never fired on this new repo (24-Nov, 2+ hours), so each run starts the
  # next one itself after ~9 min. Stops by itself once the VM exists. Public repo = free minutes.
  next:
    needs: try
    if: always() && needs.try.outputs.ready != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: sleep 540
      - run: gh workflow run grab.yml -R "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
